<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#edf3fc"><title>IFT - Repair loading</title><style>body{font:16px/1.6 system-ui,-apple-system,sans-serif;color:#24344a;background:linear-gradient(135deg,#e5f1fc,#f2eafb);margin:0;min-height:100vh;display:grid;place-items:center}main{max-width:460px;margin:22px;padding:28px;border-radius:24px;background:#ffffffc9;border:1px solid white}button,a{font:inherit}button{border:0;padding:13px 18px;border-radius:14px;color:white;background:#0877e8;cursor:pointer}a{color:#0877e8}small{display:block;margin-top:20px;color:#62748b}</style></head><body><main><strong>IFT</strong><h1>Repair app loading</h1><p>This refreshes IFT's loading cache. It does not delete your cloud accounts, transactions or saved sign-in.</p><button id="repair" type="button">Repair and reopen IFT</button><p id="status" role="status">Keep your internet connection on.</p><p><a href="/">Open my account</a> · <a href="/?demo=1">Open demo</a></p><small>Loading repair · 2026-11-24</small><noscript><p>JavaScript is disabled. Enable it in Safari settings, then reopen this page.</p></noscript></main><script>
var button=document.getElementById('repair'),statusLine=document.getElementById('status');
button.onclick=async function(){
 button.disabled=true;statusLine.textContent='Refreshing IFT loading files…';
 var partial=false;
 try{if('serviceWorker' in navigator){var regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(function(r){return new URL(r.scope).origin===location.origin;}).map(function(r){return r.unregister();}));}}catch(e){partial=true;}
 try{if('caches' in window){var keys=await caches.keys();await Promise.all(keys.filter(function(k){return k.indexOf('ift-')===0;}).map(function(k){return caches.delete(k);}));}}catch(e){partial=true;}
 try{var response=await fetch('/?ift-connection-check='+Date.now(),{cache:'no-store',credentials:'omit'});if(!response.ok)throw Error('connection');var html=await response.text();if(html.indexOf('id="root"')<0)throw Error('page');location.replace('/?ift-reload='+Date.now());}
 catch(e){statusLine.textContent='IFT could not be reached on this connection. Try another Wi-Fi or mobile data connection, then tap Repair again.';button.disabled=false;}
};
</script></body></html>
